<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Bot Crew HQ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1b1d2b;color:#eee;font:15px/1.4 monospace}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#11121b}
#gate input,#gate button{font:inherit;padding:10px;border-radius:6px;border:2px solid #555;background:#222;color:#fff}
#app{display:none;padding:10px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
h1{font-size:20px;margin:4px 0;color:#ffd84a}button{cursor:pointer}
.tb button{font:inherit;padding:6px 10px;background:#333;color:#fff;border:1px solid #666;border-radius:6px}
#lot{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.bay{background:repeating-linear-gradient(90deg,#2a2c3a 0 46%,#ffd84a 46% 50%,#2a2c3a 50%);background-size:100% 6px;background-repeat:no-repeat;background-position:bottom;background-color:#2a2c3a;border:2px solid #444;border-radius:8px;padding:8px;text-align:left;color:#eee;font:inherit}
.bay svg{width:100%;height:auto;image-rendering:pixelated;display:block}
.bay svg{max-height:140px}.zzz{display:none}.idle .zzz{display:block;animation:zz 2s infinite}.idle .bod{opacity:.85}.working .bod{animation:bob .4s infinite alternate}.working .legA{animation:leg .4s infinite alternate}.working .legB{animation:leg .4s infinite alternate-reverse}@keyframes leg{to{transform:translateY(-1px)}}@keyframes zz{0%{opacity:0;transform:translateY(2px)}50%{opacity:1}100%{opacity:0;transform:translateY(-3px)}}
@keyframes bob{to{transform:translateY(-1px)}}

.bar{height:8px;background:#111;border-radius:4px;margin:3px 0}.bar i{display:block;height:100%;border-radius:4px}
.lbl{font-size:12px;opacity:.85}.st{font-size:12px;padding:1px 6px;border-radius:4px;background:#444}.st.working{background:#2a8}
#detail,#night{background:#232536;border:2px solid #555;border-radius:8px;padding:10px;margin-top:10px}
#detail{display:none}#night{display:none}ul{padding-left:18px;margin:4px 0}
/* desktop / wall */
@media (min-width:1600px){body{font-size:18px}.bay svg{max-height:280px}.bay{padding:14px}#lot{grid-template-columns:repeat(5,1fr);gap:14px}h1{font-size:30px}
 #main{display:grid;grid-template-columns:2fr 1fr;gap:18px}#detail,#night{display:block}.lbl,.st{font-size:15px}}
body.wall{overflow:hidden;height:100vh}body.wall #app{height:100vh;display:flex;flex-direction:column}
body.wall #main{flex:1;min-height:0}body.wall #ticker{flex:none}body.wall #detail,body.wall #night{overflow:hidden}

body{font:11px/1.6 PS2P,"Courier New",monospace;background:#0d0f1e}
h1{font-size:16px;text-shadow:3px 3px 0 #b5462b}h2{font-size:13px}
#scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#5aa9e6,#9fd3f5 60%)}
#scene.dusk{background:linear-gradient(#3b2a6b,#e9845e 60%)}#scene.night{background:linear-gradient(#060818,#1b1f4a 60%)}
#stars{position:absolute;inset:0 0 40% 0;display:none}.night #stars,.dusk #stars{display:block}
#stars i{position:absolute;width:3px;height:3px;background:#fff;animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.2}}
.cloud{position:absolute;height:14px;background:#fff;opacity:.85;box-shadow:12px -8px 0 #fff,26px 0 0 #fff;width:40px;animation:drift 120s linear infinite}
.cloud.b{opacity:.5;transform:scale(.6);animation-duration:200s}.night .cloud{opacity:.15}
@keyframes drift{from{left:-120px}to{left:110%}}
#sun{position:absolute;right:12%;top:8%;width:40px;height:40px;background:#ffe066;box-shadow:0 0 0 6px #ffe06655}.night #sun{background:#e8e8ff;box-shadow:-10px 0 0 0 #1b1f4a inset}
#hq{position:absolute;left:0;right:0;bottom:0;height:40%;background:repeating-linear-gradient(0deg,#4a3b52 0 14px,#3a2d40 14px 16px),#4a3b52}
#hq:before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:repeating-linear-gradient(90deg,#7a5c84 0 24px,#5b4363 24px 28px)}
#hq:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#2a2233 0 32px,#211a29 32px 64px)}
.bay,#detail,#night,.tb button,#gate>div.box,#ticker{border:4px solid #0b0b14!important;border-radius:0!important;box-shadow:inset -4px -4px 0 #0005,inset 4px 4px 0 #fff2,4px 4px 0 #0008}
.bay,#detail,#night{background-color:#262a45!important}@media (max-width:600px){body{font-size:9px}h1{font-size:13px}.lbl,.st{font-size:8px}.tb button{font-size:9px;padding:5px 6px}}
.bay{position:relative;transition:transform .15s;font-family:inherit}
.bay:hover,.bay.sel{transform:translateY(-4px)}.bay:active{animation:boing .3s}
@keyframes boing{30%{transform:translateY(-8px) scale(1.03)}60%{transform:translateY(0) scale(.98)}}
.st.working{background:#1fbf7a;color:#032;box-shadow:0 0 8px #3f9,0 0 2px #fff;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 16px #3f9,0 0 4px #fff}}
.st{border-radius:0!important}
.lv{position:absolute;top:6px;left:6px;background:#ffd84a;color:#3a2600;padding:2px 4px;font-size:9px;border:2px solid #0b0b14}
.bubble{display:none;position:absolute;top:18px;left:50%;transform:translateX(-50%);width:90%;background:#fff;color:#111;padding:6px;font-size:9px;border:3px solid #0b0b14;z-index:3}
.bubble:after{content:"";position:absolute;bottom:-9px;left:45%;border:6px solid transparent;border-top-color:#0b0b14}
.bay:hover .bubble,.bay.sel .bubble{display:block}
.fx{position:absolute;left:0;right:0;top:20%;height:50%;pointer-events:none;display:none}.working .fx{display:block}
.fx i{position:absolute;bottom:0;width:4px;height:4px;background:#ffd84a;animation:spark 1.6s linear infinite}
.fx i:nth-child(2){left:30%;background:#fff;width:6px;height:5px;animation-delay:.5s}.fx i:nth-child(3){left:70%;background:#7ff;animation-delay:1s}.fx i:nth-child(1){left:55%}
@keyframes spark{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px) rotate(90deg);opacity:0}}
.working svg{filter:drop-shadow(0 0 6px #7ff8)}
.idle .zzz{animation:zz 2.4s steps(6) infinite}
#ticker{overflow:hidden;white-space:nowrap;background:#111!important;color:#ffd84a;padding:6px 0;margin-top:10px;font-size:10px}
#ticker span{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.bar{border:2px solid #0b0b14;border-radius:0!important;height:10px}.bar i{border-radius:0!important}
#gate{background:#0d0f1ecc}#gate input,#gate button{border-radius:0;border:4px solid #0b0b14;font-family:inherit}
@media (min-width:1600px){body{font-size:12px}h1{font-size:24px}.lbl,.st{font-size:11px}h2{font-size:16px}}

 const R=(x,y,w,h,f,k)=>'<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"'+(k?' class="'+k+'"':'')+'/>';
 let p=R(5,2,6,1,"#4a2f1b")+R(5,3,6,5,"#f1c27d")+R(6,5,1,1,"#222")+R(9,5,1,1,"#222")+R(7,7,2,1,"#c66")+R(4,8,8,7,c)+R(3,9,1,5,c)+R(12,9,1,5,c)+R(5,15,2,4,"#334","legA")+R(9,15,2,4,"#334","legB");
 const acc={juniper:R(4,1,8,2,"#7a3b1e")+R(4,3,1,7,"#7a3b1e")+R(11,3,1,5,"#7a3b1e")+R(2,3,2,1,"#7a3b1e")+R(1,4,2,5,"#7a3b1e")+R(3,2,2,2,"#ff6fae")+R(5,3,1,1,"#7a3b1e")+R(10,3,1,1,"#7a3b1e")+R(6,6,1,1,"#f9a")+R(9,6,1,1,"#f9a")+R(4,8,8,7,"#2fb5a0")+R(7,8,2,1,"#fff")+R(3,13,10,2,"#2fb5a0")+R(3,14,10,1,"#1d8a7a")+R(11,9,4,4,"#8b5a2b")+R(10,8,1,1,"#5a3a1b")+R(9,9,1,1,"#5a3a1b")+R(13,4,1,5,"#555")+R(12,3,3,1,"#f44"),
  route:R(4,2,8,2,"#223")+R(0,10,6,5,"#f3e6b0")+R(1,11,1,3,"#3d8bfd")+R(2,12,3,1,"#e33")+R(4,13,1,1,"#3d8bfd"),
  markets:R(5,4,6,1,"#111")+R(11,8,5,7,"#fff")+R(12,13,1,1,"#2a8")+R(13,11,1,3,"#2a8")+R(14,9,1,5,"#2a8"),
  clickcovered:R(7,8,2,4,"#fff")+R(7.5,9,1,3,"#336")+R(11,9,4,6,"#a5763b")+R(12,10,2,1,"#ddd")+R(12,12,2,1,"#ddd"),
  business:R(5,2,6,1,"#222")+R(4,8,8,7,"#2d3a6b")+R(7,8,2,3,"#fff")+R(7.5,9,1,3,"#c33")+R(6,8,1,4,"#1e2850")+R(9,8,1,4,"#1e2850")+R(0,12,4,4,"#6b4423")+R(1,11,2,1,"#3a2412")+R(12,7,5,5,"#eee")+R(13,10,1,1,"#2a8")+R(14,9,1,1,"#2a8")+R(15,8,1,1,"#2a8")+R(14,8,2,1,"#2a8")+R(14,12,1,4,"#888")};
 return '<svg viewBox="-2 -4 22 24" shape-rendering="crispEdges"><g class="bod">'+p+(acc[id]||"")+'</g><text class="zzz" x="14" y="0" font-size="5" fill="#9cf">Zzz</text></svg>'}
const ago=t=>{if(!t)return"no data";const m=Math.round((Date.now()/1e3-t)/60);return m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const fmt=t=>new Date(t*1e3).toLocaleString("en-US",{timeZone:"America/New_York",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})+" ET";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bar=(v,c,n)=>'<div class="lbl">'+n+': '+(v==null?"no data":v+"%")+'</div><div class="bar"><i style="width:'+(v||0)+'%;background:'+c+'"></i></div>';
let KEY=null;
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("crewhq",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=rej})}
async function kput(v){const d=await idb();return new Promise(r=>{const t=d.transaction("k","readwrite");v?t.objectStore("k").put(v,"key"):t.objectStore("k").delete("key");t.oncomplete=r})}
async function kget(){const d=await idb();return new Promise(r=>{const q=d.transaction("k").objectStore("k").get("key");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function fetchEnc(){const r=await fetch("status.enc.json?"+Date.now(),{cache:"no-store"});return r.json()}
async function derive(pc,E){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pc),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(E.salt),iterations:E.iter},base,{name:"AES-GCM",length:256},false,["decrypt"])}
async function decrypt(E,k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(E.iv)},k,u8(E.ct));return JSON.parse(new TextDecoder().decode(pt))}
let D=null,sel=null;
async function load(){try{const E=await fetchEnc();if(KEY.salt!==E.salt){await kput(null);location.reload();return}D=await decrypt(E,KEY.k);render()}catch(e){document.getElementById("gen").textContent="status unavailable ("+e.name+")"}}
function stamp(){if(!D)return;const m=Math.floor((Date.now()/1e3-D.generated)/60),el=document.getElementById("gen");el.innerHTML=(m>15?'<b style="color:#fff;background:#c33;padding:1px 6px;border-radius:4px">⚠ STALE</b> ':"")+"Last updated "+(m<1?"just now":m+" min ago")+" ("+fmt(D.generated)+") · checks every 60s"}
function render(){stamp();
 document.getElementById("lot").innerHTML=D.bots.map(b=>'<button class="bay '+b.status+'" data-id="'+b.id+'"><div class="spr">'+sprite(COL[b.id],b.id)+'<div class="fx"><i></i><i></i><i></i></div><span class="zz">Z<small>z</small><small>z</small></span></div>'+
 '<span class="lv">Lv '+(b.boost==null?"?":1+Math.floor(b.boost/20))+'</span><div class="bubble">'+esc(b.task||"no data")+'</div><b>'+esc(b.name)+'</b> <span class="st '+b.status+'">'+(b.status==="working"?"WORKING":b.status==="idle"?"sleeping":"no data")+'</span><div class="lbl">'+esc(b.role)+'</div><div class="lbl">Last: '+ago(b.last)+'</div>'+
 bar(b.fuel,"#4c4","⚡ Energy")+bar(b.boost,"#4af","⭐ XP")+'</button>').join("");
 document.querySelectorAll(".bay").forEach(e=>{if(e.dataset.id===sel)e.classList.add("sel");e.onclick=()=>{sel=e.dataset.id;document.querySelectorAll(".bay").forEach(x=>x.classList.toggle("sel",x===e));showDetail()}});ticker();sky();
 showDetail();renderNight()}
function ticker(){const w=D.bots.flatMap(b=>b.wins.slice(0,3).map(x=>"★ "+b.name+": "+x.t));document.getElementById("tk").textContent=w.length?w.join("   "):"no data — no recent wins"}
function sky(){const h=+new Date().toLocaleString("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false})%24;const sc=document.getElementById("scene");sc.className=(h>=20||h<6)?"night":(h>=18||h<8)?"dusk":"day";
 const st=document.getElementById("stars");if(!st.children.length)for(let i=0;i<40;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.top=Math.random()*100+"%";e.style.animationDelay=Math.random()*3+"s";st.appendChild(e)}}
sky();
function showDetail(){const el=document.getElementById("detail");const b=D.bots.find(x=>x.id===(sel||D.bots[0].id));if(!sel&&innerWidth<1600){return}
 el.style.display="block";el.innerHTML='<h2 style="margin:0;color:'+COL[b.id]+'">'+esc(b.name)+'</h2><div class="lbl">'+esc(b.role)+'</div>'+
 '<p><b>Current task:</b> '+esc(b.task||"no data")+'</p><p><b>Schedule / routines:</b> '+esc(b.schedule||"no data")+'</p>'+
 '<b>Recent wins (note headings, last 7 days):</b>'+(b.wins.length?'<ul>'+b.wins.map(w=>'<li>'+esc(w.t)+' <span class="lbl">('+fmt(w.at)+')</span></li>').join("")+'</ul>':'<p>no data</p>')+
 '<div class="lbl">Sources: '+(b.sources.length?esc(b.sources.join(", ")):"none found")+'</div>';if(sel&&innerWidth<1600)el.scrollIntoView({behavior:"smooth"})}
function renderNight(){const n=D.night,el=document.getElementById("night");
 el.innerHTML='<h2 style="margin:0">🌙 Night Shift</h2><div class="lbl">'+fmt(n.window[0])+' → '+fmt(n.window[1])+'</div>'+(n.items.length?'<ul>'+n.items.map(i=>'<li><b>'+esc(i.bot)+'</b> '+fmt(i.at)+': '+esc(i.what)+'</li>').join("")+'</ul>':'<p>no data — no overnight activity found</p>')}
document.getElementById("nsBtn").onclick=()=>{const el=document.getElementById("night");el.style.display="block";el.scrollIntoView({behavior:"smooth"})};
function unlock(){document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";if(/wall/.test(location.search+location.hash))document.body.classList.add("wall");load();setInterval(load,60000);setInterval(stamp,15000);setTimeout(()=>location.reload(),6*3600e3)}
document.getElementById("go").onclick=async()=>{const err=document.getElementById("err");err.textContent="Checking…";try{const E=await fetchEnc();const k=await derive(document.getElementById("pc").value,E);D=await decrypt(E,k);KEY={k,salt:E.salt};if(document.getElementById("rem").checked)await kput(KEY);err.textContent="";unlock()}catch(e){err.textContent="Wrong passcode"}};
document.getElementById("pc").onkeydown=e=>{if(e.key==="Enter")document.getElementById("go").click()};
document.getElementById("lock").onclick=async()=>{await kput(null);location.reload()};
document.getElementById("wallBtn").onclick=()=>{document.body.classList.toggle("wall");document.documentElement.requestFullscreen?.().catch(()=>{})};
kget().then(v=>{if(v&&v.k){KEY=v;unlock()}}).catch(()=>{});
</script></body></html>
<style>.zzz{display:none!important}.spr{position:relative;overflow:hidden}
.fx{top:0!important;height:100%!important;bottom:0}.fx i{bottom:10%!important}
@keyframes spark{from{transform:translateY(0);opacity:1}to{transform:translateY(-70%);opacity:0}}
.zz{display:none;position:absolute;right:8%;top:6%;font-size:20px;color:#9cf;text-shadow:2px 2px 0 #0b0b14;animation:zzf 2.4s ease-in-out infinite}
.zz small{font-size:14px;margin-left:2px}.idle .zz{display:block}
@keyframes zzf{0%,100%{transform:translateY(4px);opacity:.6}50%{transform:translateY(-6px);opacity:1}}
@media (min-width:1600px){.zz{font-size:28px}.zz small{font-size:20px}}
@media (prefers-reduced-motion:reduce){.zz{animation:none!important}}</style>
